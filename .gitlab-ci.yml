# Akasha CI: security scanning (all pipelines) + cross-platform binary release
# (on version tags). Prebuilt binaries are static (CGO disabled) and published
# as release assets with a SHA256SUMS file that install.sh verifies.
stages:
- test
- secret-detection
- build
- release

# ── Security scanning (unchanged) ───────────────────────────────────────────
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection

# ── Cross-compile static binaries on a tag ──────────────────────────────────
build-binaries:
  stage: build
  image: golang:1.25
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - cd daemon
  - |
    for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
      goos=${target%/*}; goarch=${target#*/}
      out="../akasha-${goos}-${goarch}"
      echo "building ${out}"
      CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/akasha
    done
  - cd ..
  # Sign the shipped bundle with the official publisher key so the daemon
  # auto-trusts it (hands-off). Conditional: if AKASHA_SIGNING_KEY (a CI secret,
  # base64 Ed25519 private key) is unset, ship unsigned — users then approve
  # manually. The linux/amd64 binary runs on this CI image.
  - |
    if [ -n "${AKASHA_SIGNING_KEY:-}" ]; then
      umask 077; printf '%s' "$AKASHA_SIGNING_KEY" > /tmp/official.key
      for f in daemon/templates/*.yaml; do
        ./akasha-linux-amd64 template sign "$f" --key /tmp/official.key --publisher akasha-official
      done
      rm -f /tmp/official.key
      echo "signed $(ls daemon/templates/*.yaml.sig | wc -l) bundle templates"
    else
      echo "AKASHA_SIGNING_KEY not set — shipping unsigned bundle (manual trust required)"
    fi
  # The provider templates are shipped as DATA, not compiled into the binary —
  # package the curated bundle (and any signatures) so install.sh can place it
  # in ShippedDir.
  - tar -czf akasha-templates.tar.gz -C daemon templates
  - sha256sum akasha-darwin-amd64 akasha-darwin-arm64 akasha-linux-amd64 akasha-linux-arm64 akasha-templates.tar.gz > SHA256SUMS
  - cat SHA256SUMS
  artifacts:
    paths:
    - akasha-darwin-amd64
    - akasha-darwin-arm64
    - akasha-linux-amd64
    - akasha-linux-arm64
    - akasha-templates.tar.gz
    - SHA256SUMS
    expire_in: 1 week

# ── Upload to the package registry + publish a release with direct links ────
# The direct asset links give stable public URLs of the form
#   https://gitlab.com/inferlabs/akasha/-/releases/permalink/latest/downloads/<name>
# which install.sh fetches and checksum-verifies.
release-binaries:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
  - build-binaries
  rules:
  - if: $CI_COMMIT_TAG
  variables:
    PKG: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/akasha/${CI_COMMIT_TAG}"
  script:
  - |
    for f in akasha-darwin-amd64 akasha-darwin-arm64 akasha-linux-amd64 akasha-linux-arm64 akasha-templates.tar.gz SHA256SUMS; do
      echo "uploading $f"
      curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$f" "${PKG}/${f}"
    done
  - |
    release-cli create --name "Akasha ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" \
      --description "Static prebuilt binaries. Verify with SHA256SUMS." \
      --assets-link "{\"name\":\"akasha-darwin-arm64\",\"url\":\"${PKG}/akasha-darwin-arm64\",\"filepath\":\"/akasha-darwin-arm64\",\"link_type\":\"package\"}" \
      --assets-link "{\"name\":\"akasha-darwin-amd64\",\"url\":\"${PKG}/akasha-darwin-amd64\",\"filepath\":\"/akasha-darwin-amd64\",\"link_type\":\"package\"}" \
      --assets-link "{\"name\":\"akasha-linux-arm64\",\"url\":\"${PKG}/akasha-linux-arm64\",\"filepath\":\"/akasha-linux-arm64\",\"link_type\":\"package\"}" \
      --assets-link "{\"name\":\"akasha-linux-amd64\",\"url\":\"${PKG}/akasha-linux-amd64\",\"filepath\":\"/akasha-linux-amd64\",\"link_type\":\"package\"}" \
      --assets-link "{\"name\":\"akasha-templates.tar.gz\",\"url\":\"${PKG}/akasha-templates.tar.gz\",\"filepath\":\"/akasha-templates.tar.gz\",\"link_type\":\"other\"}" \
      --assets-link "{\"name\":\"SHA256SUMS\",\"url\":\"${PKG}/SHA256SUMS\",\"filepath\":\"/SHA256SUMS\",\"link_type\":\"other\"}"
