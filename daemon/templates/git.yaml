# Generic git host token. "value" alias tolerates single-value labels.
kind: provider
name: git
version: 1

credential:
  fields:
    token: {secret: true, aliases: [value]}

# Where existing tokens live, most authoritative first. One instance per host
# from the credential store; the shell/.env rules yield a single "default".
#
# This list IS the audit: nothing outside these paths is read.
discover:
  # 1. git's own credential store: https://user:token@host, one per line.
  - source: url-lines
    path: ~/.git-credentials
    risk: critical
    map:
      token: password

  # 2. Shell configs — `export GITHUB_TOKEN=...` and friends.
  - {source: env-lines, path: ~/.zshrc,        risk: critical, map: &git_env_vars {token: GITHUB_TOKEN}}
  - {source: env-lines, path: ~/.zprofile,     risk: critical, map: *git_env_vars}
  - {source: env-lines, path: ~/.bashrc,       risk: critical, map: *git_env_vars}
  - {source: env-lines, path: ~/.bash_profile, risk: critical, map: *git_env_vars}
  - {source: env-lines, path: ~/.profile,      risk: critical, map: *git_env_vars}

  # 3. .env files in the home directory and common project roots.
  - {source: env-lines, path: ~/.env*,           risk: critical, map: *git_env_vars}
  - {source: env-lines, path: ~/workplace/.env*, risk: critical, map: *git_env_vars}
  - {source: env-lines, path: ~/projects/.env*,  risk: critical, map: *git_env_vars}
  - {source: env-lines, path: ~/code/.env*,      risk: critical, map: *git_env_vars}
  - {source: env-lines, path: ~/dev/.env*,       risk: critical, map: *git_env_vars}
  - {source: env-lines, path: ~/src/.env*,       risk: critical, map: *git_env_vars}
  - {source: env-lines, path: ~/work/.env*,      risk: critical, map: *git_env_vars}

deliver:
  # On-demand: git calls back per fetch/push via its credential protocol.
  # Most hosts accept any username when the password is a token.
  - mode: helper
    format: kv-lines
    static:
      username: token
    map:
      password: token
    expiry:
      key: password_expiry_utc
      format: unix

  # Materialized: plain env var, for tools that only read GIT_TOKEN.
  - mode: env
    env:
      GIT_TOKEN: "{token}"
