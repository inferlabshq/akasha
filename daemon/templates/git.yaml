# Generic git host token. "value" alias tolerates single-value labels.
kind: provider
name: git
version: 1

credential:
  fields:
    token: {secret: true, aliases: [value]}

# Where existing tokens live. git's credential store is the only source here,
# because it is the only one that names the HOST a token belongs to — each line
# is https://user:token@host, so the instance is the hostname and the agent
# block below can scope a credential helper to it.
#
# A bare GITHUB_TOKEN in a shell rc names no host, so those rules live in
# github.yaml (and GITLAB_TOKEN in gitlab.yaml) where the host is known. Kept
# here they produced a git:default instance that scoped a helper to a host
# called "default", which git would never consult.
#
# This list IS the audit: nothing outside these paths is read.
discover:
  # git's own credential store: https://user:token@host, one per line.
  - source: url-lines
    path: ~/.git-credentials
    risk: critical
    map:
      token: password

deliver:
  # On-demand: git calls back per fetch/push via its credential protocol.
  # Most hosts accept any username when the password is a token.
  - mode: helper
    format: kv-lines
    static:
      username: token
    map:
      password: token
    expiry:
      key: password_expiry_utc
      format: unix

  # Materialized: plain env var, for tools that only read GIT_TOKEN.
  - mode: env
    env:
      GIT_TOKEN: "{token}"

# Env-ownership wiring. Discovery keys this provider by HOST (~/.git-credentials
# is a list of https://user:token@host lines), so one directive host-scopes every
# instance it finds via {instance} — github.yaml and gitlab.yaml name their host
# literally because they are the service, whereas git is the protocol and learns
# its hosts from the credential store. Without this block the git:* labels that
# discovery creates have no broker wired to them, and GIT_CONFIG_GLOBAL is
# exported pointing at a gitconfig nothing writes.
agent:
  own:
    - mechanism: git-credential-helper
      env: GIT_CONFIG_GLOBAL
      file: git.gitconfig
      host: "{instance}"
      inherit_user_gitconfig: true
