# GitHub token. "value" alias tolerates single-value labels.
kind: provider
name: github
version: 1

credential:
  fields:
    token: {secret: true, aliases: [value]}

# A GITHUB_TOKEN in a shell rc or a .env names no host, so it is discovered
# HERE rather than in git.yaml: this template knows the host is github.com, so
# the single "default" instance these rules yield still scopes a credential
# helper to somewhere git will actually consult. git.yaml keeps the credential
# store, whose lines carry their own host.
#
# This list IS the audit: nothing outside these paths is read.
discover:
  # Shell configs — `export GITHUB_TOKEN=...` and friends.
  - {source: env-lines, path: ~/.zshrc,        risk: critical, map: &gh_env_vars {token: GITHUB_TOKEN}}
  - {source: env-lines, path: ~/.zprofile,     risk: critical, map: *gh_env_vars}
  - {source: env-lines, path: ~/.bashrc,       risk: critical, map: *gh_env_vars}
  - {source: env-lines, path: ~/.bash_profile, risk: critical, map: *gh_env_vars}
  - {source: env-lines, path: ~/.profile,      risk: critical, map: *gh_env_vars}

  # .env files in the home directory and common project roots.
  - {source: env-lines, path: ~/.env*,           risk: critical, map: *gh_env_vars}
  - {source: env-lines, path: ~/workplace/.env*, risk: critical, map: *gh_env_vars}
  - {source: env-lines, path: ~/projects/.env*,  risk: critical, map: *gh_env_vars}
  - {source: env-lines, path: ~/code/.env*,      risk: critical, map: *gh_env_vars}
  - {source: env-lines, path: ~/dev/.env*,       risk: critical, map: *gh_env_vars}
  - {source: env-lines, path: ~/src/.env*,       risk: critical, map: *gh_env_vars}
  - {source: env-lines, path: ~/work/.env*,      risk: critical, map: *gh_env_vars}

deliver:
  # On-demand: git calls back per fetch/push via its credential protocol
  # (key=value lines on stdout). password_expiry_utc makes git (>=2.41) drop
  # the cached credential at the TTL and re-ask — re-auditing each window.
  # x-access-token works as the username for both PATs and app tokens.
  - mode: helper
    format: kv-lines
    static:
      username: x-access-token
    map:
      password: token
    expiry:
      key: password_expiry_utc
      format: unix

  # Materialized: plain env var, for tools that only read GITHUB_TOKEN.
  - mode: env
    env:
      GITHUB_TOKEN: "{token}"

# Env-ownership wiring: route every git operation in an agent session through
# `akasha helper github` so the GitHub token is resolved — and audited — per
# fetch/push and never sits in plaintext in a keychain the agent can read. The
# git-credential-helper mechanism (Go-rendered) owns GIT_CONFIG_GLOBAL,
# re-includes the human's real ~/.gitconfig (identity/aliases), then host-scopes
# a credential helper to github.com whose command is always the akasha binary —
# no template-supplied command, so no injection. The same mechanism serves
# gitlab/gitea/bitbucket with no new code (it is a protocol, not a service).
agent:
  own:
    - mechanism: git-credential-helper
      env: GIT_CONFIG_GLOBAL
      file: github.gitconfig
      host: github.com
      inherit_user_gitconfig: true
