# GitLab token. "value" alias tolerates single-value labels.
kind: provider
name: gitlab
version: 1

credential:
  fields:
    token: {secret: true, aliases: [value]}

deliver:
  # On-demand: git calls back per fetch/push via its credential protocol.
  # oauth2 works as the username for both PATs and OAuth tokens on GitLab.
  - mode: helper
    format: kv-lines
    static:
      username: oauth2
    map:
      password: token
    expiry:
      key: password_expiry_utc
      format: unix

  # Materialized: plain env var, for tools that only read GITLAB_TOKEN.
  - mode: env
    env:
      GITLAB_TOKEN: "{token}"

# Route every git operation for gitlab.com through `akasha helper gitlab`, the
# same git-credential-helper mechanism github uses. Both host-scope a section of
# the ONE GIT_CONFIG_GLOBAL gitconfig, so github + gitlab broker side by side in
# a single session (the daemon merges them into one file).
agent:
  own:
    - mechanism: git-credential-helper
      env: GIT_CONFIG_GLOBAL
      file: gitlab.gitconfig
      host: gitlab.com
      inherit_user_gitconfig: true
