# GitLab token. "value" alias tolerates single-value labels.
kind: provider
name: gitlab
version: 1

credential:
  fields:
    token: {secret: true, aliases: [value]}

# Same reasoning as github.yaml: a bare GITLAB_TOKEN names no host, so it is
# discovered by the template that knows the host. Nothing discovered GitLab
# tokens before this, so a user with only GITLAB_TOKEN set had the provider
# wired but empty.
#
# This list IS the audit: nothing outside these paths is read.
discover:
  # Shell configs — `export GITLAB_TOKEN=...` and friends.
  - {source: env-lines, path: ~/.zshrc,        risk: critical, map: &gl_env_vars {token: GITLAB_TOKEN}}
  - {source: env-lines, path: ~/.zprofile,     risk: critical, map: *gl_env_vars}
  - {source: env-lines, path: ~/.bashrc,       risk: critical, map: *gl_env_vars}
  - {source: env-lines, path: ~/.bash_profile, risk: critical, map: *gl_env_vars}
  - {source: env-lines, path: ~/.profile,      risk: critical, map: *gl_env_vars}

  # .env files in the home directory and common project roots.
  - {source: env-lines, path: ~/.env*,           risk: critical, map: *gl_env_vars}
  - {source: env-lines, path: ~/workplace/.env*, risk: critical, map: *gl_env_vars}
  - {source: env-lines, path: ~/projects/.env*,  risk: critical, map: *gl_env_vars}
  - {source: env-lines, path: ~/code/.env*,      risk: critical, map: *gl_env_vars}
  - {source: env-lines, path: ~/dev/.env*,       risk: critical, map: *gl_env_vars}
  - {source: env-lines, path: ~/src/.env*,       risk: critical, map: *gl_env_vars}
  - {source: env-lines, path: ~/work/.env*,      risk: critical, map: *gl_env_vars}

deliver:
  # On-demand: git calls back per fetch/push via its credential protocol.
  # oauth2 works as the username for both PATs and OAuth tokens on GitLab.
  - mode: helper
    format: kv-lines
    static:
      username: oauth2
    map:
      password: token
    expiry:
      key: password_expiry_utc
      format: unix

  # Materialized: plain env var, for tools that only read GITLAB_TOKEN.
  - mode: env
    env:
      GITLAB_TOKEN: "{token}"

# Route every git operation for gitlab.com through `akasha helper gitlab`, the
# same git-credential-helper mechanism github uses. Both host-scope a section of
# the ONE GIT_CONFIG_GLOBAL gitconfig, so github + gitlab broker side by side in
# a single session (the daemon merges them into one file).
agent:
  own:
    - mechanism: git-credential-helper
      env: GIT_CONFIG_GLOBAL
      file: gitlab.gitconfig
      host: gitlab.com
      inherit_user_gitconfig: true
