name: Release

# On a version tag: build static binaries, code-sign + notarize the macOS
# binaries (Developer ID), sign the template bundle, and publish a GitHub
# Release with a SHA256SUMS file that install.sh verifies.
#
# WHY macOS signing matters here: a Developer ID signature has a STABLE Team-ID
# Designated Requirement, so the keychain ACL guarding a user's vault key keeps
# matching across akasha updates — no re-prompt, no lockout. Ad-hoc/unsigned
# binaries have a CDHash-only DR that breaks on every update (the exact footgun
# install.sh's local self-signed cert works around for source builds).
#
# The macOS sign+notarize step is DORMANT until these repo secrets exist; without
# them it ships unsigned darwin binaries (today's behaviour) with a warning:
#   MACOS_CERT_P12          base64 of the "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD     the .p12 export password
#   MACOS_KEYCHAIN_PASSWORD any string — password for the ephemeral CI keychain
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: Inferlabs Pty Ltd (TEAMID)"
#   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD   notarytool creds (app-specific pw)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ── macOS binaries: build → sign → notarize (must run on a mac runner) ──────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build darwin binaries
        run: |
          cd daemon
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "../akasha-darwin-$arch" ./cmd/akasha
          done

      # Single shell-gated step so the absence of secrets is a clean no-op
      # (the `secrets` context isn't reliably usable in step-level `if:`).
      - name: Sign + notarize (Developer ID) — skipped if secrets absent
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "::warning::MACOS_CERT_P12 not set — shipping UNSIGNED darwin binaries; the vault-key keychain ACL will re-prompt on update."
            exit 0
          fi

          # Import the Developer ID identity into an ephemeral keychain.
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

          # Sign with a hardened runtime + secure timestamp (both required to
          # notarize). --identifier pins the stable DR anchor (matches the local
          # cert path and the launchd label).
          for b in akasha-darwin-amd64 akasha-darwin-arm64; do
            codesign --force --timestamp --options runtime \
              --identifier dev.akasha.daemon -s "$SIGN_IDENTITY" "$b"
            codesign -vvv --strict "$b"
          done

          # Notarize. notarytool needs an archive; a bare Mach-O can't be
          # `stapler staple`d, so the ticket lives with Apple and Gatekeeper
          # checks it online (matters for browser-downloaded copies — curl|sh
          # installs aren't quarantined). The Developer ID SIGNATURE — not the
          # staple — is what gives the stable keychain Designated Requirement.
          for b in akasha-darwin-amd64 akasha-darwin-arm64; do
            ditto -c -k --keepParent "$b" "$b.zip"
            xcrun notarytool submit "$b.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            rm -f "$b.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: akasha-darwin-*
          if-no-files-found: error

  # ── Linux binaries + the (optionally signed) template bundle ────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cross-compile linux
        run: |
          cd daemon
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "../akasha-linux-$arch" ./cmd/akasha
          done

      # Signing the bundle is what makes provider trust survive an upgrade.
      # A publisher signature is checked BEFORE the hash-bound local approval
      # record (trust.Approved), so a signed template stays trusted after every
      # release. Unsigned, the fallback is a record bound to the file's SHA-256
      # — which means every release that changes a byte of any template silently
      # revokes that provider's approval, and users hit "template not trusted
      # yet" at use time, mid-workflow, on every upgrade.
      #
      # That is a bad enough default that shipping unsigned must be a DELIBERATE
      # act, not the consequence of a missing secret. Set ALLOW_UNSIGNED_BUNDLE
      # to ship without signatures anyway.
      # The official trust root is compiled in (//go:embed official.pub), so a
      # binary built before the key is committed can NEVER verify an official
      # signature — no later publishing fixes it. That makes provisioning the
      # key an ordering constraint on the first tag, and the failure is silent:
      # such a build looks healthy until users find every provider needs
      # hand-approving, again after every release.
      #
      # Ask the binary we just built rather than grepping the file, so this
      # check and the verifier cannot disagree about what "configured" means.
      - name: Verify the official trust root is compiled in
        env:
          ALLOW_UNSIGNED_BUNDLE: ${{ vars.ALLOW_UNSIGNED_BUNDLE }}
        run: |
          set -euo pipefail
          if ./akasha-linux-amd64 version | grep -q "official trust root: present"; then
            echo "official trust root present in this build"
            exit 0
          fi
          if [ "${ALLOW_UNSIGNED_BUNDLE:-}" = "true" ]; then
            echo "::warning::Building with NO official trust root (ALLOW_UNSIGNED_BUNDLE=true). Signed bundles will not verify for users of this build."
            exit 0
          fi
          echo "::error::daemon/internal/publisher/official.pub is still the placeholder, so this"
          echo "::error::build can never verify an official signature — the key is EMBEDDED AT BUILD"
          echo "::error::TIME, so publishing it later does not fix binaries already shipped."
          echo "::error::Fix: run the key ceremony in docs/PLUGIN_FORMAT.md, commit the PUBLIC key to"
          echo "::error::daemon/internal/publisher/official.pub, then re-tag. To ship without a trust"
          echo "::error::root anyway, set the repository variable ALLOW_UNSIGNED_BUNDLE=true."
          exit 1

      - name: Sign the template bundle
        env:
          AKASHA_SIGNING_KEY: ${{ secrets.AKASHA_SIGNING_KEY }}
          ALLOW_UNSIGNED_BUNDLE: ${{ vars.ALLOW_UNSIGNED_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -z "${AKASHA_SIGNING_KEY:-}" ]; then
            if [ "${ALLOW_UNSIGNED_BUNDLE:-}" != "true" ]; then
              echo "::error::AKASHA_SIGNING_KEY is not set, so this release would ship an UNSIGNED template bundle."
              echo "::error::Unsigned templates fall back to hash-bound local approvals, so THIS AND EVERY FUTURE"
              echo "::error::release will revoke every user's provider approvals — they will hit 'template not"
              echo "::error::trusted yet' at use time after each upgrade."
              echo "::error::Fix: set the AKASHA_SIGNING_KEY secret. To ship unsigned anyway, set the"
              echo "::error::repository variable ALLOW_UNSIGNED_BUNDLE=true."
              exit 1
            fi
            echo "::warning::Shipping an UNSIGNED template bundle (ALLOW_UNSIGNED_BUNDLE=true). Users must hand-approve every provider, and must re-approve after every release."
            exit 0
          fi
          umask 077; printf '%s' "$AKASHA_SIGNING_KEY" > /tmp/official.key
          for f in daemon/templates/*.yaml; do
            ./akasha-linux-amd64 template sign "$f" --key /tmp/official.key --publisher akasha-official
          done
          rm -f /tmp/official.key
          # Every template must end up signed: a partial bundle silently
          # degrades exactly the providers whose .sig is missing.
          yaml_count=$(ls daemon/templates/*.yaml | wc -l)
          sig_count=$(ls daemon/templates/*.yaml.sig | wc -l)
          if [ "$yaml_count" -ne "$sig_count" ]; then
            echo "::error::signed $sig_count of $yaml_count templates — refusing to ship a partially signed bundle"
            exit 1
          fi
          echo "signed $sig_count/$yaml_count templates"

      - name: Package templates
        run: |
          set -euo pipefail
          tar -czf akasha-templates.tar.gz -C daemon templates
          # The .sig files are what carry trust to users; a tar that dropped
          # them would produce a bundle that looks fine and re-prompts everyone.
          if ls daemon/templates/*.yaml.sig >/dev/null 2>&1; then
            packed=$(tar -tzf akasha-templates.tar.gz | grep -c '\.yaml\.sig$' || true)
            [ "$packed" -gt 0 ] || { echo "::error::signatures were not packaged into the bundle"; exit 1; }
            echo "packaged $packed signature(s)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            akasha-linux-*
            akasha-templates.tar.gz
          if-no-files-found: error

  # ── Assemble → checksum (AFTER signing) → publish ───────────────────────────
  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten + checksum
        run: |
          mv dist/darwin/* dist/linux/* .
          # Checksums MUST be computed HERE — after macOS signing rewrote the
          # darwin binaries — because install.sh verifies each download against
          # this file. Checksumming pre-signed binaries would break the install.
          sha256sum akasha-darwin-amd64 akasha-darwin-arm64 \
                    akasha-linux-amd64 akasha-linux-arm64 \
                    akasha-templates.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            akasha-darwin-amd64
            akasha-darwin-arm64
            akasha-linux-amd64
            akasha-linux-arm64
            akasha-templates.tar.gz
            SHA256SUMS
