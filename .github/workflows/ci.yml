name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux is the primary matrix entry: it runs the whole suite, and — because
  # DescribeFor() takes the target GOOS as a parameter rather than using build
  # tags — it also exercises the macOS SBPL renderer, which is the half of the
  # sandbox with a generated-code surface.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install bubblewrap and permit user namespaces
        # The Linux sandbox backend. Without it the enforcement tests skip
        # rather than fail, so CI would go green on a machine that cannot
        # actually isolate anything.
        #
        # Installing bwrap is not sufficient: Ubuntu 24.04 restricts
        # unprivileged user namespaces via AppArmor, so bwrap is present and the
        # kernel still refuses ("the kernel refused to create a sandbox"). This
        # is the same wall a user hits, and the sysctl below is exactly what
        # sandbox.Explain() tells them to run — so this step also checks that
        # the advice works.
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --dev-bind / / -- /bin/true && echo "user namespaces work"
      - name: Build
        run: cd daemon && go build ./...
      - name: Vet
        run: cd daemon && go vet ./...
      - name: Test
        run: cd daemon && go test ./...
      - name: Test with race detector
        run: cd daemon && go test -race ./...
      - name: Installer tests
        # install.sh is a shipped entry point with its own suite, and the bug it
        # guards — a green install over an empty templates directory — is
        # invisible in Go tests and only surfaces for a user days later as "No
        # templates loaded." The suite is hermetic (a file:// release fixture, a
        # redirected HOME) and takes seconds, so there is no reason for it to be
        # the one suite a PR does not run.
        run: bash scripts/install.test.sh
      - name: Shipped templates are signed and trusted
        # A template whose signature no longer verifies is not an error — it is
        # SILENTLY SKIPPED. `template list` says NEEDS TRUST, but `discover`
        # just prints "No credentials found.", so editing a bundled template and
        # forgetting to re-sign it ships a build that finds none of the user's
        # credentials and says nothing is wrong.
        #
        # Nothing in the Go suite covers this: the signatures are data, not
        # code, so `go test ./...` stays green with every .sig in the bundle
        # corrupted. This step is the only thing standing between a one-line
        # YAML edit and a release that quietly discovers nothing.
        run: |
          cd daemon && go build -o /tmp/akasha ./cmd/akasha
          out=$(AKASHA_SHIPPED_TEMPLATES_DIR="$PWD/templates" \
                AKASHA_TEMPLATES_DIR=/nonexistent /tmp/akasha template list)
          echo "$out"
          if echo "$out" | grep -qi 'needs trust'; then
            echo "::error::a shipped template is not trusted — re-sign the bundle (scripts/sign-bundle.sh)"
            exit 1
          fi
          # And assert the bundle is not silently EMPTY, which would also pass
          # the grep above.
          # `|| true`: grep -c exits 1 when the count is zero, and the step runs
          # under `bash -e`, so an EMPTY bundle killed this step before it could
          # print the reason — the one case the count exists to catch.
          count=$(echo "$out" | grep -c 'trusted' || true)
          echo "trusted templates: $count"
          [ "$count" -ge 6 ] || { echo "::error::expected the full shipped bundle, found $count"; exit 1; }

      - name: Secret-guard hook tests
        # The other shipped shell entry point. Its failure mode is the worse of
        # the two — a regex that stops matching lets an agent read the raw
        # credential files the hook exists to keep it out of.
        run: bash scripts/hooks/akasha-secret-guard.test.sh
      - name: Confirm this job is NOT root
        # The sandbox's failure mode is invisible to root.
        #
        # bwrap has to CREATE each mount point, and root can do that anywhere —
        # so a deny set that an ordinary user cannot mount launches perfectly for
        # uid 0. `akasha run` was broken for every normal Linux user through four
        # separate causes, and three rounds of verification missed all of them by
        # testing as root while the suite stayed green.
        #
        # GitHub's Ubuntu images already run as the unprivileged `runner` user,
        # so this asserts a property we currently have rather than adding one.
        # It exists because adding a `container:` key to this job would silently
        # switch it to root and take the coverage with it, with nothing failing.
        run: |
          id
          if [ "$(id -u)" = "0" ]; then
            echo "::error::this job is running as root, which cannot detect the sandbox's real failure mode"
            exit 1
          fi
          echo "running as uid $(id -u) — the sandbox tests below mean what they say"
      - name: Sandbox enforcement (bubblewrap)
        # Runs the integration tests that EXECUTE the sandbox, not just render
        # its arguments. AKASHA_SANDBOX_REQUIRE makes a missing or non-working
        # backend a failure instead of a skip: a sandbox test that quietly skips
        # is how an unenforced sandbox ships.
        #
        # The TestEnforceRealSurface* cases are the ones that matter most here:
        # every other enforcement test builds a one-rule Spec over a temp
        # directory, which exercises the kernel but not the deny set akasha
        # actually ships. Nothing drove Surface() through a real sandbox until
        # those existed, which is how the macOS-only paths, the docker socket,
        # the session bus and a symlinked home each broke the launch with CI
        # green. Verified against both historical shapes: the mount-everything
        # version fails them with "Can't mkdir parents for
        # /Volumes/akasha-sessions", and the skip-missing-files version fails
        # them by leaking ~/.netrc created mid-run.
        env:
          AKASHA_SANDBOX_REQUIRE: "1"
        run: cd daemon && go test ./internal/sandbox/... -run Enforce -v

      - name: Sandbox doctor (the profile a real user gets)
        # The tests above build a Spec themselves. This runs the shipped
        # command, on the shipped surface, as the unprivileged runner — the one
        # check whose subject is "what does a user actually get on this
        # machine" rather than "does the code do what the test says".
        #
        # It exits non-zero if the sandbox is not enforcing, and the coverage
        # table it prints is in the job log, so a rule that quietly stops being
        # masked shows up as a diff in CI output rather than as nothing at all.
        run: |
          cd daemon
          go build -o /tmp/akasha ./cmd/akasha
          /tmp/akasha sandbox doctor

      - name: A rule that masks nothing must be declared, not discovered
        # Guards the one thing the coverage table cannot guard by existing: that
        # somebody reads it. On Linux the only acceptable unmasked rules are the
        # macOS-only paths, so anything ELSE in that section fails the build and
        # has to be justified in the diff that introduced it.
        run: |
          cd daemon
          /tmp/akasha sandbox doctor > /tmp/doctor.txt
          sed -n '/NOT MASKED/,$p' /tmp/doctor.txt > /tmp/unmasked.txt
          cat /tmp/unmasked.txt
          if grep -E '^#   (unplaceable|tmpfs|null-bind|island)' /tmp/unmasked.txt; then
            echo "::error::a rule is unmasked for a reason other than its platform"
            exit 1
          fi

  # A secret is not fixed by deleting it in a later commit, so the unit of
  # scanning is the whole history rather than the diff under review.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout clones one commit by default, which would leave
          # every earlier commit unscanned.
          fetch-depth: 0
      - name: Install gitleaks
        # Pinned: an unpinned scanner changes its ruleset underneath the
        # fingerprints recorded in .gitleaksignore.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        # --log-opts=--all reaches every ref, not just the branch tip: a secret
        # removed on a side branch is still published with the repository.
        # Known non-secret fixtures are pinned by fingerprint in
        # .gitleaksignore, so this job is expected to be silent and any output
        # is a real finding.
        run: gitleaks git --log-opts="--all" --redact --no-banner .

  # macOS exists so sandbox-exec actually runs somewhere other than a developer
  # laptop. The SBPL renderer is unit-tested on Linux, but rendering a profile
  # and having the kernel enforce it are different claims — and the seatbelt
  # half is the one that cannot be checked by reading argv.
  # macOS is a MATRIX, not a single runner, because the two things most likely
  # to break here are version-sensitive and neither is visible in a unit test.
  #
  #   - The seatbelt profile closes the keychain by denying the securityd mach
  #     services. Whether that name set still closes it on a NEW macOS release is
  #     a fact about that release, and the only way to know is to run there.
  #   - macos-13 is the last Intel image GitHub offers. Akasha builds a darwin
  #     amd64 binary that, until this matrix, had never been EXECUTED anywhere —
  #     Rosetta and Intel users were shipped on the strength of a clean compile.
  #
  # Pinned to explicit versions rather than macos-latest: "latest" silently moves
  # to a new OS and would drop the oldest one we still claim to support, which is
  # exactly the coverage this exists to hold.
  macos:
    name: macOS ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing version must not cancel the others: which versions break is
      # the information this job exists to produce.
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: intel
          - os: macos-14
            arch: apple-silicon
          - os: macos-15
            arch: apple-silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Report the machine
        # The arch is asserted, not assumed: if GitHub re-images macos-13 onto
        # Apple Silicon, this job would keep passing while Intel coverage
        # silently disappeared — and a compile is not coverage.
        run: |
          sw_vers
          uname -m
          if [ "${{ matrix.arch }}" = "intel" ] && [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::${{ matrix.os }} is no longer Intel ($(uname -m)); Intel coverage has been lost"
            exit 1
          fi
      - name: Build
        run: cd daemon && go build ./...
      - name: Vet
        run: cd daemon && go vet ./...
      - name: Test
        run: cd daemon && go test ./...
      - name: Test with race detector
        run: cd daemon && go test -race ./...
      - name: Plant a keychain item for the sandbox probe
        # The self-test asks whether the keychain is reachable from INSIDE the
        # sandbox, and it can only answer by attempting a read. A read that fails
        # because the item does not exist is indistinguishable from one that
        # fails because the sandbox blocked it — and a fresh runner has no vault
        # key. Without this step the keychain half of the enforcement test would
        # pass on every macOS version while proving nothing, which is precisely
        # the false green this matrix was added to prevent.
        #
        # SelfTest now refuses to probe an item it cannot read out here, so the
        # item has to exist for the check to run at all.
        run: |
          security add-generic-password -U \
            -s "akasha-ci-probe" -a "vault-mlkem-sk" -w "ci-probe-not-a-real-key" \
            "$HOME/Library/Keychains/login.keychain-db"
          security find-generic-password -s "akasha-ci-probe" -a "vault-mlkem-sk" -w >/dev/null
          echo "probe item is readable outside the sandbox"
      - name: Sandbox enforcement (seatbelt)
        env:
          AKASHA_SANDBOX_REQUIRE: "1"
        run: cd daemon && go test ./internal/sandbox/... -run Enforce -v
      - name: Remove the probe item
        if: always()
        run: security delete-generic-password -s "akasha-ci-probe" -a "vault-mlkem-sk" || true
