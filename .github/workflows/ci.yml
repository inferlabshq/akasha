name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: cd daemon && go build ./...
      - name: Vet
        run: cd daemon && go vet ./...
      - name: Test
        run: cd daemon && go test ./...
