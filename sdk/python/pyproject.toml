[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akasha-py"
version = "0.1.0"
description = "Thin client SDK for the Akasha local vault daemon"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["ai", "agents", "security", "vault", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.25.0",
]
openai = [
    "openai>=1.30.0",
]
all = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
    "respx>=0.21",
    "anthropic>=0.25.0",
    "openai>=1.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["akasha"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
